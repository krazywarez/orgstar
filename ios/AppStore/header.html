<!doctype html>
<!-- Product page header, after the krz.sh hero: three iPhones fanned over the app's green.
     header.html renders the 21:9 header (3840x1646), header.html#wide the 16:9 one (5244x2950),
     with headless Chromium, then the alpha channel is removed:
     Chromium --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=3840,1646 --screenshot=header-21x9.png header.html
     Chromium --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=5244,2950 --screenshot=header-16x9.png "file://$PWD/header.html#wide"
     magick header-21x9.png -alpha off PNG24:header-21x9.png -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --u: 1px; --top: 180px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 3840px; height: 1646px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 55% 75% at 50% 30%, #7a9845 0%, #56722c 35%, #33451a 70%, #182109 100%);
  }
  .iphone {
    position: absolute; left: 50%; top: var(--top);
    width: calc(860 * var(--u)); height: calc(1868 * var(--u));
    padding: calc(24 * var(--u)); border-radius: calc(140 * var(--u)); background: #0c0c12;
    box-shadow: 0 calc(50 * var(--u)) calc(120 * var(--u)) rgba(0, 0, 0, 0.5);
  }
  .iphone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: calc(116 * var(--u)); }
  .center { transform: translateX(-50%); z-index: 2; }
  .left { transform: translate(calc(-50% - 760 * var(--u)), calc(120 * var(--u))) rotate(-8deg); }
  .right { transform: translate(calc(-50% + 760 * var(--u)), calc(120 * var(--u))) rotate(8deg); }

  /* 16:9, 5244x2950. */
  html.wide { --u: 1.6px; --top: 420px; }
  html.wide, .wide body { width: 5244px; height: 2950px; }
</style>
<script>if (location.hash === "#wide") document.documentElement.className = "wide";</script>
</head>
<body>
  <div class="iphone left"><img src="screenshots/iphone-6.9/02-reader.png"></div>
  <div class="iphone right"><img src="screenshots/iphone-6.9/04-tables.png"></div>
  <div class="iphone center"><img src="screenshots/iphone-6.9/01-agenda.png"></div>
</body>
</html>
