name = "orgstar-license"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "krz.sh/apps/orgstar/buy*", zone_name = "krz.sh" },
  { pattern = "krz.sh/apps/orgstar/license*", zone_name = "krz.sh" },
  { pattern = "krz.sh/apps/orgstar/renew*", zone_name = "krz.sh" },
]

[vars]
SPONSORABLE = "ccleberg"
LIFETIME_DOLLARS = "60"
MONTHLY_DOLLARS = "5"
# A monthly key lasts this long; the app renews it well before.
RENEW_DAYS = "40"
# The GitHub OAuth app's client ID. Its callback URL is https://krz.sh/apps/orgstar/license.
GITHUB_CLIENT_ID = ""
